<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="The Vibe Grid — katalog anime &amp; manga dari AniList, dengan pencarian dan filter aura.">

    <title>The Vibe Grid — FlipPlay</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">

    <link href="./output.css" rel="stylesheet">
</head>

<body class="bg-paper text-ink antialiased">

    <!-- =========================
         MASTHEAD
         ========================== -->
    <header class="masthead masthead--sticky masthead--menu">

        <p class="masthead__line">EDISI #01 · FLIPPLAY</p>

        <a class="masthead__name" href="./index.html">
            The Vibe <span class="masthead__accent">Grid</span>
        </a>

        <button class="masthead__toggle"
                id="menu-toggle"
                type="button"
                aria-label="Buka menu navigasi"
                aria-expanded="false"
                aria-controls="menu-sheet">

            <svg id="menu-icon"
                 xmlns="http://www.w3.org/2000/svg"
                 width="22" height="22"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 aria-hidden="true">
                <line x1="4" y1="6" x2="20" y2="6"></line>
                <line x1="4" y1="12" x2="20" y2="12"></line>
                <line x1="4" y1="18" x2="20" y2="18"></line>
            </svg>
        </button>

        <nav class="masthead__nav" aria-label="Navigasi utama">
            <ul>
                <li><a href="./index.html">FlipPlay</a></li>
                <li><a href="./vibe-grid.html" aria-current="page">Vibe Grid</a></li>
            </ul>
        </nav>

        <div class="masthead__sheet" id="menu-sheet">
            <a href="./index.html">FlipPlay</a>
            <a href="./vibe-grid.html" aria-current="page">Vibe Grid</a>
        </div>

        <hr class="masthead__rule">

    </header>

    <main>

        <!-- =========================
             FILTER BAND
             ========================== -->
        <section class="filter-band" aria-labelledby="katalog-title">

            <h1 class="filter-band__title" id="katalog-title">
                Katalog Anime &amp; Manga
            </h1>

            <form class="search-form" id="search-form" role="search">
                <label class="search">
                    <svg class="search__icon"
                         xmlns="http://www.w3.org/2000/svg"
                         width="18" height="18"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                    </svg>
                    <input id="search-input"
                           type="search"
                           name="q"
                           placeholder="Cari judul, genre, atau studio…"
                           autocomplete="off"
                           aria-label="Cari judul anime atau manga">
                </label>
            </form>

            <div class="aura" id="aura-list" role="group" aria-label="Filter aura"></div>

            <p class="count" id="result-count" role="status" aria-live="polite"></p>

        </section>

        <!-- =========================
             GRID
             ========================== -->
        <section class="media-grid" id="media-grid" aria-label="Daftar judul"></section>

    </main>

    <!-- =========================
         FOOTER
         ========================== -->
    <footer class="foot-mast">

        <p class="foot-mast__wordmark">Flip<span>Play</span></p>

        <p class="foot-mast__tagline">Watch. Read. Repeat.</p>

        <nav class="foot-mast__links" aria-label="Navigasi footer">
            <a href="./index.html">FlipPlay</a>
            <a href="./vibe-grid.html">Vibe Grid</a>
            <a href="./index.html#contact">Contact</a>
        </nav>

        <p class="foot-mast__licence">
            © 2026 FlipPlay · Data dari AniList
        </p>

    </footer>

    <script type="module" src="./js/main.js"></script>

</body>

</html>
